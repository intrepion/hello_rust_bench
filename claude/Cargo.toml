[package]
name = "hello-world"
version = "0.1.0"
edition = "2021"
default-run = "hello"

[lib]
name = "hello_world"
path = "src/lib.rs"

[[bin]]
name = "hello"
path = "src/main.rs"

[[bin]]
name = "detailed_profile"
path = "src/bin/detailed_profile.rs"

[[bin]]
name = "memory_profile"
path = "src/bin/memory_profile.rs"

[[bench]]
name = "hello_benchmarks"
harness = false

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
